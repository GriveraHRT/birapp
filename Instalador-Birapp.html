<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Birapp — Bodega Cervecera</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="refresh" content="0; url=./index.html">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Birapp">
  <meta name="theme-color" content="#231812">

  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="./assets/icon-cheers.svg">
  <link rel="manifest" href="./manifest.json">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 0%, #3A2518 0%, #1C1410 100%);
      color: #FFFBEB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    .card {
      max-width: 340px;
      background: rgba(255, 251, 235, 0.06);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 20px;
      padding: 24px;
    }

    img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    p {
      margin: 0 0 18px;
      font-size: 14px;
      color: #FDE68A;
      line-height: 1.45;
    }

    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, #F59E0B 0%, #B45309 100%);
      color: #FFF;
      text-decoration: none;
      font-weight: 700;
    }
  </style>

  <script>
    window.location.replace("./index.html");
  </script>
</head>

<body>
  <div class="card">
    <img src="./assets/icon-192.png" alt="Birapp">
    <h1>Abriendo Birapp...</h1>
    <p>Si no redirige automáticamente, toca el botón para abrir tu bodega cervecera.</p>
    <a href="./index.html">Ir a Birapp</a>
  </div>
</body>

</html>
